version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    labels:
      - "theme/dependencies"
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *" # once a month, mid-month
    groups:
      go:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/api"
    labels:
      - "theme/dependencies"
      - "theme/api"
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *" # once a month, mid-month
    groups:
      go-api:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/jobspec2"
    labels:
      - "theme/dependencies"
      - "theme/jobspec"
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *" # once a month, mid-month
    ignore:
      - dependency-name: "github.com/hashicorp/hcl/v2"
    groups:
      go-jobspec:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/ui"
    labels:
      - "theme/dependencies"
      - "theme/ui"
    schedule:
      interval: "cron"
      cronjob: "0 9 15 * *" # once a month, mid-month
    allow:
      - dependency-type: "production"
        update-types:
          - "version-update:semver-patch"
      - dependency-type: "development"
        update-types:
          - "version-update:semver-patch"
    versioning-strategy: "increase"
    groups:
      ui-dev:
         patterns:
           - "*"
         dependency-type: "development"
      ui-prod:
         patterns:
           - "*"
         dependency-type: "production"
